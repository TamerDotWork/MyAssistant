<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <title>Resume Chatbot</title>
  <script src="https://code.jquery.com/jquery-3.6.0.min.js"></script>
  <style>
    body {
      font-family: Arial, sans-serif;
      background: #f8f9fa;
      margin: 0;
      padding: 0;
    }
    #chatbox {
      width: 400px;
      margin: 50px auto;
      background: #fff;
      border-radius: 10px;
      box-shadow: 0px 4px 10px rgba(0,0,0,0.1);
      padding: 20px;
    }
    #messages {
      height: 400px;
      overflow-y: auto;
      border: 1px solid #ddd;
      border-radius: 5px;
      padding: 10px;
      background: #fafafa;
      margin-bottom: 15px;
    }
    .user {
      text-align: right;
      margin: 8px 0;
    }
    .bot {
      text-align: left;
      margin: 8px 0;
    }
    .typing {
      font-style: italic;
      color: #888;
    }
    input[type="text"] {
      width: 75%;
      padding: 10px;
      border: 1px solid #ccc;
      border-radius: 5px;
    }
    button {
      padding: 10px 15px;
      border: none;
      background: #007bff;
      color: white;
      border-radius: 5px;
      cursor: pointer;
    }
    button:hover {
      background: #0056b3;
    }
  </style>
</head>
<body>
  <div id="chatbox">
    <h3>🤖 Resume Chatbot</h3>
    <div id="messages"></div>
    <input type="text" id="query" placeholder="Type your question..." />
    <button onclick="sendMessage()">Send</button>
  </div>

  <script>
    function appendMessage(sender, text, extraClass="") {
      let msgClass = sender === "You" ? "user" : "bot";
      let id = "msg-" + Date.now();
      $("#messages").append(`<div id="${id}" class="${msgClass} ${extraClass}"><b>${sender}:</b> ${text}</div>`);
      $("#messages").scrollTop($("#messages")[0].scrollHeight);
      return id;
    }

    function sendMessage() {
      let query = $("#query").val();
      if (!query.trim()) return;

      appendMessage("You", query);
      $("#query").val("");

      // Add typing placeholder
      let typingId = appendMessage("Bot", "Typing...", "typing");

      $.ajax({
        url: "/chat",
        type: "POST",
        contentType: "application/json",
        data: JSON.stringify({ query: query }),
        success: function(response) {
          // Replace typing with actual answer
          $("#" + typingId).remove();
          appendMessage("Bot", response.answer);
        },
        error: function() {
          $("#" + typingId).remove();
          appendMessage("Bot", "❌ Error connecting to API.");
        }
      });
    }

    $("#query").keypress(function(e) {
      if (e.which === 13) {
        sendMessage();
        return false;
      }
    });
  </script>
</body>
</html>
